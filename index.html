<title>摆件收藏 · Music Atlas</title>
<style>
:root {
  color-scheme: dark;
  --paper: #eae9e0;
  --muted: #b2b5aa;
  --rule: #434740;
  --green: #e3edac;
  --background: #1c211e;
  font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--background); color: var(--paper); }
button, a { -webkit-tap-highlight-color: transparent; }
button { color: inherit; font: inherit; cursor: pointer; }
a { color: inherit; text-underline-offset: .24em; }
:focus-visible { outline: 2px solid #dbe780; outline-offset: 5px; }
[hidden] { display: none !important; }
.page { max-width: 1320px; margin: auto; padding: 26px clamp(16px, 5vw, 76px) 38px; }
.masthead {
  display: flex; align-items: center; justify-content: space-between; gap: 20px;
  border-bottom: 1px solid var(--rule); padding-bottom: 19px;
}
.wordmark { font: italic 26px Georgia, serif; }
.context, .face-indicator { font-size: 12px; color: var(--muted); }
.heading { margin: 30px 0 23px; }
h1 { margin: 0; font-size: clamp(32px, 5vw, 58px); line-height: 1.15; font-weight: 550; letter-spacing: -.045em; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--rule); }
.tabs button {
  appearance: none; border: 0; border-bottom: 2px solid transparent; background: none;
  color: var(--muted); min-height: 46px; padding: 0 clamp(10px, 2.2vw, 25px); font-size: 14px;
}
.tabs button[aria-selected="true"] { border-color: var(--green); color: var(--green); }
.tabs button:hover { color: var(--paper); }
.panel { display: grid; grid-template-columns: minmax(0, 2.2fr) minmax(238px, 1fr); }
.stage {
  --size: min(62%, 304px);
  position: relative; display: grid; place-items: center; min-height: 464px; isolation: isolate;
  background: radial-gradient(ellipse at 47% 32%, #62675a 0%, #3a4038 55%, #2b312b 100%);
  overflow: hidden;
}

.shelf::before, .shelf::after { content: ""; position: absolute; left: 0; right: 0; top: 0; }
.shelf::before { height: 46%; background: linear-gradient(#21161450, #bc8e6340); }
.shelf::after { top: 46%; border-top: 1px solid #c8a28568; box-shadow: 0 4px 12px #241811aa; }
.workspace { position: relative; width: var(--size); aspect-ratio: 1; margin-top: 3%; perspective: 1000px; }
.sleeve {
  position: relative; display: grid; width: 100%; height: 100%; touch-action: pan-y;
  border: 0; padding: 0; background: transparent; text-align: left; color: #f0f3d4;
  transform: translateX(var(--drag, 0px)); transition: transform .38s cubic-bezier(.2,.8,.2,1);
}
.sleeve.dragging { transition: none; cursor: grabbing; }
.sheet { grid-area: 1/1; display: flex; flex-direction: column; position: relative; overflow: hidden; width: 100%; height: 100%; }
.sheet.front { background: #232d25; box-shadow: 0 12px 26px #1e160e66; padding: 7%; }
.print {
  position: absolute; inset: 15% -38% -14% 1%; transform: rotate(-19deg);
  background: repeating-radial-gradient(ellipse at 70% 62%, #d9e49c00 0 4px, #bfcc8080 5px, #707d5260 6px 7px, transparent 8px 13px);
  -webkit-mask-image: linear-gradient(150deg, #0000 15%, #000 39%, #000 63%, #0000 94%);
  mask-image: linear-gradient(150deg, #0000 15%, #000 39%, #000 63%, #0000 94%);
}
.artist, .cover-title, .cover-caption { position: relative; z-index: 1; }
.artist { font: italic clamp(21px, 4.6vw, 48px)/1 Georgia, serif; }
.cover-title { display: grid; margin-top: auto; gap: 1px; }
.cover-title time { font: 500 clamp(21px, 4.4vw, 45px)/1 Georgia, serif; letter-spacing: -.045em; }
.cover-title [lang] { font-size: clamp(13px, 2.3vw, 23px); font-weight: 570; }
.cover-caption { margin-top: 7%; color: #d5ddbd; font: 10px/1.2 monospace; letter-spacing: .08em; }
.sheet.back {
  color: #263021; background: #e6e6d1; padding: 7%; gap: 5%; box-shadow: 0 12px 26px #1e160e66;
}
.back b { font: italic clamp(19px, 3vw, 30px)/1 Georgia, serif; }
.back strong { font-size: clamp(13px, 2.1vw, 23px); line-height: 1.2; }
.back .edition { border-top: 1px solid #778069; padding-top: 5%; font: clamp(10px, 1.7vw, 15px)/1.4 monospace; }
.back .venue { margin-top: auto; font: clamp(9px, 1.3vw, 12px)/1.4 monospace; }
.carrier {
  pointer-events: none; position: absolute; z-index: 3; display: none;
  filter: drop-shadow(0 12px 9px #171f1690);
}
[data-mode="glass"] .carrier {
  display: block; inset: -5% 5% -5% -7%;
  border: 1px solid #cedaa6b0; border-right-color: #eeffcd;
  border-radius: 7% 4% 4% 7% / 5% 4% 4% 5%;
  background: linear-gradient(110deg, #91ad6c66, #c8dbac0c 22% 59%, #d4e8ab37 66%, #fff2 68%, #66894b44 89%);
  box-shadow: inset 0 0 0 5px #e8f4cd23, inset -4px 0 11px #e0ffd16b;
}
[data-mode="glass"] .sleeve { transform: translateX(calc(var(--pull, 0px) + var(--drag, 0px))); }
[data-mode="glass"][data-open="true"] .sleeve { --pull: 24%; z-index: 4; }
.spine { display: none; }
[data-mode="stone"] .spine {
  position: absolute; display: block; z-index: -1; width: 49%; height: 78%; left: -27%; bottom: 0;
  border: 1px solid #a4a48966; border-radius: 0 2px 2px 0;
  background: repeating-linear-gradient(90deg, #92947a 0 9%, #3c4638 9% 11%, #b9ad96 11% 20%, #4b5242 20% 23%);
  box-shadow: 10px 10px 25px #1a160f77; opacity: .79;
}
[data-mode="stone"] .carrier {
  display: block; inset: 27% auto -4% -38%; width: 51%; height: 77%;
  background: radial-gradient(ellipse at 20% 32%, #a0a190, #5c6051 57%, #383c33);
  clip-path: polygon(evenodd, 1% 99%, 9% 85%, 14% 72%, 12% 55%, 20% 49%, 22% 38%, 30% 34%, 29% 24%, 37% 12%, 48% 11%, 55% 3%, 67% 6%, 74% 13%, 70% 28%, 77% 35%, 79% 48%, 68% 52%, 66% 61%, 76% 66%, 78% 83%, 92% 91%, 97% 99%, 1% 99%, 35% 56%, 41% 66%, 50% 64%, 56% 53%, 61% 44%, 54% 36%, 47% 39%, 44% 48%, 35% 56%, 1% 99%);
}
[data-mode="stone"] .sleeve { transform: translate(var(--drag, 0px), var(--lift, 0px)); }
[data-mode="stone"][data-open="true"] .sleeve { --lift: -10%; z-index: 4; }
[data-mode="paper"][data-open="true"] .sleeve { transform: translateY(-8%) scale(1.04); }
[data-flipped="true"] .back { animation: turn .26s ease-out; }
@keyframes turn { from { transform: perspective(560px) rotateY(-65deg); opacity: .72; } to { transform: rotateY(0); opacity: 1; } }
.panel-info {
  display: flex; flex-direction: column; align-items: stretch;
  padding: 28px clamp(16px, 3vw, 38px) 24px; border-bottom: 1px solid var(--rule);
}
.face-indicator { display: block; }
h2 { margin: 11px 0 9px; font-size: clamp(22px, 3vw, 32px); font-weight: 550; line-height: 1.22; }
.album { margin: 0; font-family: Georgia, "Songti SC", serif; line-height: 1.45; }
.description { color: var(--muted); font-size: 14px; line-height: 1.75; margin: 20px 0; }
.info-detail { font-size: 13px; line-height: 1.65; }
.info-detail dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; margin: 12px 0 8px; }
.info-detail dt { color: var(--muted); }
.info-detail dd { margin: 0; overflow-wrap: anywhere; }
.info-detail a { display: inline-block; margin-top: 6px; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 23px; margin-top: auto; }
.controls button {
  min-height: 45px; padding: 8px 13px; background: transparent; border: 1px solid #848a76;
  font-size: 13px; font-weight: 620;
}
.controls button.primary { background: var(--green); border-color: var(--green); color: #222819; }
.controls button:hover { border-color: #f3f2e4; }
.footer { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px 20px; padding-top: 17px; color: var(--muted); font-size: 12px; line-height: 1.6; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
@media (max-width: 750px) {
  .panel { grid-template-columns: minmax(0, 1fr); }
  .stage { min-height: 0; height: clamp(285px, 73vw, 435px); --size: min(59%, 290px); }
  .panel-info { padding-inline: 0; }
  .heading { margin-top: 24px; }
}
@media (max-width: 360px) {
  .tabs button { font-size: 13px; padding-inline: 9px; }
  .context { text-align: right; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}
.ornament-slot {
  --width: 23%;
  --height: 30%;
  position: absolute; z-index: 1; bottom: var(--ground); width: var(--width); height: var(--height);
  display: grid; align-items: end; padding: 0; border: 0; background: transparent;
}
.ornament-slot[data-side="left"] { left: var(--side-offset); transform: translateX(-50%); }
.ornament-slot[data-side="right"] { right: var(--side-offset); transform: translateX(50%); }
.ornament-slot[data-item="lamp"] { --height: 29%; }
.ornament-slot[data-item="turntable"] { --height: 20%; --width: 30%; }
.ornament-slot[data-item="chrome"] { --height: 34%; --width: 22%; }
.ornament-slot[data-item="crab"] { --height: 17%; --width: 24%; }
.ornament-slot[data-item="bronze"] { --height: 36%; --width: 19%; }
.ornament-slot[data-item="speaker"] { --height: 33%; --width: 22%; }
.ornament-slot[data-item="censer"] { --height: 21%; --width: 19%; }
.ornament-slot[data-item="bookend"] {
  --height: 22%; --width: 20%;
  --side-offset: calc((100% - var(--size) - var(--width)) / 2 + 2.5%);
}
.ornament-slot[data-item="bookend"][data-side="right"] img { transform: scaleX(-1); }
.ornament-slot[data-item="wavebox"] { --height: 18%; --width: 25%; }
.ornament-slot[data-item="pleat"] { --height: 33%; --width: 20%; }
.ornament-slot[data-item="flask"] { --height: 28%; --width: 17%; }
.ornament-slot[data-item="recordbin"] { --height: 25%; --width: 26%; }
.ornament-slot[data-item="lava"] { --height: 26%; --width: 19%; }
.ornament-slot[data-item="medal"] { --height: 26%; --width: 18%; }
.ornament-slot[data-item="linenlamp"] { --height: 35%; --width: 22%; }

  },
  porcelainloop: {
    name: "交环瓷雕", description: "从陶艺收藏延伸出一对斜交的瓷环。透过两个孔洞可以看见架后的明暗。",
    image: 'assets/porcelainloop.png'
  },
  opaline: {
    name: "乳白玻璃灯", description: "乳白玻璃碟搭在橄榄色石座上，点亮后能看见漫开的微暖白光。",
    light: 'opal',
    image: 'assets/opaline.png'
  },
  murano: {
    name: "蓝绿玻璃结", description: "从吹制玻璃收藏里提取蓝绿玻璃的叠色，让弯曲的玻璃带围出透空。",
    image: 'assets/murano.png'
  }
};
const newestObjects = new Set(["bugattimirror", "leafbronzelamp", "whitehandwheel", "buffachair"]);
const tabs = [...document.querySelectorAll('[role="tab"]')];
const panel = document.querySelector('#study-panel');
const stage = document.querySelector('.stage');
const sleeve = document.querySelector('.sleeve');
const front = document.querySelector('.front');
const back = document.querySelector('.back');
const pull = document.querySelector('#pull');
const flip = document.querySelector('#flip');
const putBack = document.querySelector('#return');
const face = document.querySelector('#face-indicator');
const description = document.querySelector('#description');
const edition = document.querySelector('#edition-detail');
const downloadObject = document.querySelector('#download-object');
const sourceLink = document.querySelector('#object-source');
const announcement = document.querySelector('#announcement');
const cardInfo = document.querySelector('#card-info');
const objectInfo = document.querySelector('.object-info');
const objectPicker = document.querySelector('.object-picker');
const allObjects = document.querySelector('#all-objects');
const objectDescription = document.querySelector('#object-description');
const objectStatus = document.querySelector('#object-status');
const studyTitle = document.querySelector('#study-title');
const studyTip = document.querySelector('#study-tip');
const slots = [...document.querySelectorAll('.ornament-slot')];
const glows = [...document.querySelectorAll('.lamp-glow')];
const placeButtons = [...document.querySelectorAll('[data-place]')];
const removeObject = document.querySelector('#remove-object');
const switchLamp = document.querySelector('#switch-lamp');
const shelf = { left: 'whitehandwheel', right: 'leafbronzelamp' };
const sideNames = { left: '左侧', right: '右侧' };
const litLamps = new Set(['leafbronzelamp']);
let selectedObject = 'leafbronzelamp';
let showAllObjects = true;
let mode = 'paper';
let opened = false;
let flipped = false;
let drag = null;
let ignoreDragClick = false;



function renderObjects() {
  const active = mode === 'objects';
  for (const slot of slots) {
    const id = shelf[slot.dataset.side];
    slot.hidden = !active || !id;
    if (slot.hidden) continue;
    const item = objects[id];
    slot.dataset.item = id;
    slot.dataset.lit = String(litLamps.has(id));
    const image = slot.querySelector('img');
    if (image.getAttribute('src') !== item.image) image.src = item.image;
    slot.setAttribute('aria-label', sideNames[slot.dataset.side] + ' · 选择' + item.name);
    slot.setAttribute('aria-pressed', String(id === selectedObject));
  }
  for (const glow of glows) {
    const id = shelf[glow.dataset.side];
    if (active && litLamps.has(id)) glow.dataset.tone = objects[id].light;
    else delete glow.dataset.tone;
  }
  if (!active) return;
  allObjects.setAttribute('aria-expanded', String(showAllObjects));
  allObjects.textContent = showAllObjects ? '收起前批摆件' : '看全部 ' + Object.keys(objects).length + ' 件';
  for (const button of objectPicker.children) {
    button.setAttribute('aria-pressed', String(button.dataset.object === selectedObject));
    button.hidden = !showAllObjects && !newestObjects.has(button.dataset.object);
  }
  const item = objects[selectedObject];
  sourceLink.hidden = !item.source;
  if (item.source) {
    const [label, href] = item.source;
    sourceLink.href = href;
    sourceLink.textContent = label + ' ↗';
  }
  downloadObject.href = item.image;
  downloadObject.download = item.name + '.png';
  objectDescription.textContent = item.description;
  for (const button of placeButtons) {
    button.setAttribute('aria-pressed', String(shelf[button.dataset.place] === selectedObject));
  }
  const onShelf = Object.values(shelf).includes(selectedObject);
  const lampOn = litLamps.has(selectedObject);
  removeObject.disabled = !onShelf;
  switchLamp.hidden = !item.light || !onShelf;
  switchLamp.setAttribute('aria-label', item.name + '灯光');
  switchLamp.setAttribute('aria-pressed', String(lampOn));
  switchLamp.textContent = lampOn ? '灯光 · 开' : '灯光 · 关';
}

function selectObject(id) {
  selectedObject = id;
  if (!newestObjects.has(id)) showAllObjects = true;
  renderObjects();
  if (showAllObjects) {
    const viewport = objectPicker.getBoundingClientRect();
    const choice = objectPicker.querySelector('button[aria-pressed="true"]').getBoundingClientRect();
    objectPicker.scrollTop += Math.min(0, choice.top - viewport.top)
      + Math.max(0, choice.bottom - viewport.bottom);
  }
}

function moveObject(side) {
  const current = Object.keys(shelf).find(position => shelf[position] === selectedObject);
  if (current === side) return;
  const previous = shelf[side];
  if (current) shelf[current] = previous;
  shelf[side] = selectedObject;
  renderObjects();
  objectStatus.textContent = objects[selectedObject].name + '已摆在' + sideNames[side] +
    (previous ? '，' + objects[previous].name + (current ? '已移至' + sideNames[current] : '已拿下') : '');
}

const olderObjects = Object.keys(objects).filter(id => !newestObjects.has(id));
for (const id of [...newestObjects, ...olderObjects]) {
  const item = objects[id];
  const button = document.createElement('button');
  button.type = 'button';
  button.dataset.object = id;
  const thumbnail = document.createElement('img');
  thumbnail.src = item.image;
  thumbnail.alt = '';
  button.append(thumbnail, item.name);
  button.addEventListener('click', () => selectObject(id));
  objectPicker.append(button);
}

allObjects.addEventListener('click', () => {
  showAllObjects = !showAllObjects;
  if (!showAllObjects && !newestObjects.has(selectedObject)) {
    selectedObject = Object.values(shelf).find(id => newestObjects.has(id)) || newestObjects.values().next().value;
  }
  renderObjects();
});

for (const slot of slots) {
  slot.addEventListener('click', () => selectObject(shelf[slot.dataset.side]));
}

for (const button of placeButtons) {
  button.addEventListener('click', () => moveObject(button.dataset.place));
}

removeObject.addEventListener('click', () => {
  const side = Object.keys(shelf).find(position => shelf[position] === selectedObject);
  if (!side) return;
  shelf[side] = null;
  renderObjects();
  placeButtons.find(button => button.dataset.place === side).focus({ preventScroll: true });
  objectStatus.textContent = objects[selectedObject].name + '已拿下';
});

switchLamp.addEventListener('click', () => {
  const item = objects[selectedObject];
  if (!item.light || !Object.values(shelf).includes(selectedObject)) return;
  const wasOn = litLamps.delete(selectedObject);
  if (!wasOn) litLamps.add(selectedObject);
  renderObjects();
  objectStatus.textContent = item.name + (wasOn ? '已关闭' : '已打开');
});

function selectMode(tab) {
  mode = tab.dataset.mode;
  stage.dataset.mode = mode;
  panel.dataset.study = mode;
  panel.setAttribute('aria-labelledby', tab.id);
  for (const option of tabs) {
    const selected = option === tab;
    option.setAttribute('aria-selected', String(selected));
    option.tabIndex = selected ? 0 : -1;
  }
  const showObjects = mode === 'objects';
  studyTitle.textContent = showObjects ? '摆件收藏' : '把唱片拿在手里';
  downloadObject.hidden = !showObjects;
  if (!showObjects) sourceLink.hidden = true;
  cardInfo.hidden = showObjects;
  objectInfo.hidden = !showObjects;
  studyTip.textContent = showObjects ? '摆件为原创试摆造型。' : '可点击封套，也可向右拖出。Esc 放回。';
  renderObjects();
  if (!showObjects) {
    const variant = variants[mode];
    description.textContent = variant.description;
  }
}

function renderCard() {
  stage.dataset.open = String(opened);
  stage.dataset.flipped = String(flipped);
  front.hidden = flipped;
  back.hidden = !flipped;
  pull.hidden = opened;
  flip.hidden = !opened;
  putBack.hidden = !opened;
  edition.hidden = !flipped;
  flip.textContent = flipped ? '翻回正面' : '翻到背面';
  sleeve.setAttribute('aria-label', !opened ? '抽出 Fishmans 收藏卡' : flip.textContent);
  const label = opened ? (flipped ? '手中 · 背面' : '手中 · 正面') : '架上 · 正面';
  face.textContent = label;
  announcement.textContent = label;
}

function takeOut() {
  opened = true;
  renderCard();
  flip.focus({ preventScroll: true });
}

function turnCard() {
  flipped = !flipped;
  renderCard();
}

function returnCard() {
  opened = false;
  flipped = false;
  renderCard();
  pull.focus({ preventScroll: true });
}

for (const tab of tabs) {
  tab.addEventListener('click', () => selectMode(tab));
  tab.addEventListener('keydown', event => {
    const index = tabs.indexOf(tab);
    const targets = { ArrowLeft: (index + tabs.length - 1) % tabs.length, ArrowRight: (index + 1) % tabs.length, Home: 0, End: tabs.length - 1 };
    if (!Object.hasOwn(targets, event.key)) return;
    event.preventDefault();
    const next = tabs[targets[event.key]];
    selectMode(next);
    next.focus();
  });
}

pull.addEventListener('click', takeOut);
flip.addEventListener('click', turnCard);
putBack.addEventListener('click', returnCard);
document.addEventListener('keydown', event => {
  if (event.key === 'Escape' && opened) returnCard();
});
sleeve.addEventListener('click', () => {
  if (ignoreDragClick) {
    ignoreDragClick = false;
    return;
  }
  if (opened) turnCard();
  else takeOut();
});
sleeve.addEventListener('pointerdown', event => {
  if (opened || !event.isPrimary || event.button !== 0) return;
  ignoreDragClick = false;
  drag = { id: event.pointerId, start: event.clientX };
  sleeve.setPointerCapture(event.pointerId);
});
sleeve.addEventListener('pointermove', event => {
  if (drag?.id !== event.pointerId) return;
  const delta = Math.max(0, event.clientX - drag.start);
  if (delta < 5 && !sleeve.classList.contains('dragging')) return;
  sleeve.classList.add('dragging');
  sleeve.style.setProperty('--drag', Math.min(delta, sleeve.clientWidth * .34) + 'px');
});
function finishDrag(event) {
  if (drag?.id !== event.pointerId) return;
  const delta = event.clientX - drag.start;
  drag = null;
  sleeve.classList.remove('dragging');
  sleeve.style.removeProperty('--drag');
  if (event.type !== 'pointerup' || delta < 8) return;
  ignoreDragClick = true;
  window.setTimeout(() => { ignoreDragClick = false; }, 0);
  if (delta >= Math.min(60, sleeve.clientWidth * .24)) takeOut();
}
sleeve.addEventListener('pointerup', finishDrag);
sleeve.addEventListener('pointercancel', finishDrag);
sleeve.addEventListener('lostpointercapture', finishDrag);
selectMode(tabs.find(tab => '#' + tab.dataset.mode === location.hash) || tabs.at(-1));
</script>
</body>
</html>
